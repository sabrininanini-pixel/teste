function handleDanosEnterKey(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); // Impede a quebra de linha
        
        // Dispara o evento blur para salvar imediatamente
        const blurEvent = new Event('blur');
        event.target.dispatchEvent(blurEvent);
        
        // Remove o foco
        event.target.blur();
    }
}


// ========== SISTEMA MODO DESKTOP - RESET DE EMERGÊNCIA ==========

let modoDesktopAtivo = false;
let viewportOriginal = '';

/**
 * ✅ RESETAR PARA MODO MOBILE (função de emergência)
 */
function resetarParaModoMobile() {
    console.log('🔄 RESETANDO para modo mobile...');
    
    modoDesktopAtivo = false;
    
    // Resetar viewport
    const viewportMeta = document.querySelector('meta[name="viewport"]');
    if (viewportMeta) {
        viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
    }
    
    // Remover classe modo desktop
    document.body.classList.remove('modo-desktop-ativo');
    
    // Limpar localStorage
    localStorage.removeItem('modoDesktopMobile');
    localStorage.removeItem('viewportOriginal');
    
    console.log('✅ Reset completo - Modo Mobile ativado');
    showNotification('Modo Mobile', 'success', 3000);
}

/**
 * ✅ DETECTAR DISPOSITIVO MOBILE SIMPLES
 */
function detectarDispositivoMobile() {
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isMobile = /Android|webOS|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(userAgent);
    const isAndroidApp = typeof Android !== 'undefined';
    
    console.log('📱 Detecção:', { isMobile, isAndroidApp });
    
    // SEMPRE considerar mobile para teste
    document.body.classList.add('mobile-device');
    console.log('✅ Forçando modo mobile para teste');
}

/**
 * ✅ ALTERNAR MODO DESKTOP - FUNÇÃO PRINCIPAL
 */
function alternarModoDesktop() {
    const isAndroidApp = typeof Android !== 'undefined';
    const viewportMeta = document.querySelector('meta[name="viewport"]');
    
    // Alternar estado
    modoDesktopAtivo = !modoDesktopAtivo;
    
    if (isAndroidApp) {
        // ✅ APK ANDROID
        Android.ativarModoDesktop(modoDesktopAtivo);
        console.log('📱 APK - Modo Desktop:', modoDesktopAtivo);
    } else {
        // ✅ NAVEGADOR NORMAL
        if (modoDesktopAtivo) {
            // ATIVAR MODO DESKTOP
            if (!viewportOriginal && viewportMeta) {
                viewportOriginal = viewportMeta.getAttribute('content');
            }
            if (viewportMeta) {
                viewportMeta.setAttribute('content', 'width=1024, initial-scale=0.5, maximum-scale=5.0, user-scalable=yes');
            }
            document.body.classList.add('modo-desktop-ativo');
            console.log('🖥️ Navegador - Modo Desktop ATIVADO');
        } else {
            // DESATIVAR MODO DESKTOP
            if (viewportMeta && viewportOriginal) {
                viewportMeta.setAttribute('content', viewportOriginal);
            } else {
                viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
            }
            document.body.classList.remove('modo-desktop-ativo');
            console.log('📱 Navegador - Modo Desktop DESATIVADO');
        }
    }
    
    salvarEstadoDesktop();
    
    // Feedback visual
    if (modoDesktopAtivo) {
        showNotification('Modo Desktop', 'success', 3000);
    } else {
        showNotification('Modo Mobile', 'info', 3000);
    }
}

/**
 * ✅ SALVAR ESTADO NO LOCALSTORAGE
 */
function salvarEstadoDesktop() {
    localStorage.setItem('modoDesktopMobile', modoDesktopAtivo.toString());
    if (viewportOriginal) {
        localStorage.setItem('viewportOriginal', viewportOriginal);
    }
    console.log('💾 Estado salvo - Modo Desktop:', modoDesktopAtivo);
}

/**
 * ✅ CARREGAR ESTADO SALVO (SEM FORÇAR MODO DESKTOP)
 */
function carregarEstadoDesktop() {
    const estadoSalvo = localStorage.getItem('modoDesktopMobile');
    const viewportSalvo = localStorage.getItem('viewportOriginal');
    
    if (viewportSalvo) {
        viewportOriginal = viewportSalvo;
    }
    
    // NÃO aplicar modo desktop automaticamente
    if (estadoSalvo === 'true') {
        modoDesktopAtivo = true;
        console.log('📂 Estado carregado: Modo Desktop (não aplicado)');
    } else {
        modoDesktopAtivo = false;
        console.log('📂 Estado carregado: Modo Mobile');
    }
}

/**
 * ✅ INICIALIZAÇÃO - FORÇAR MODO MOBILE
 */
function inicializarSistemaDesktop() {
    console.log('🚀 Iniciando sistema modo desktop...');
    
    // 1. Sempre forçar detecção mobile
    detectarDispositivoMobile();
    
    // 2. Carregar estado (mas não aplicar)
    carregarEstadoDesktop();
    
    // 3. Se estava em modo desktop, resetar
    if (modoDesktopAtivo) {
        console.log('⚠️ Modo desktop detectado - Resetando...');
        setTimeout(resetarParaModoMobile, 1000);
    }
    
    console.log('✅ Sistema modo desktop inicializado');
}

// ✅ EXECUTAR QUANDO A PÁGINA CARREGAR
document.addEventListener('DOMContentLoaded', function() {
    inicializarSistemaDesktop();
});

                font-weight: bold !important;
            }
        `;
        el.appendChild(style);
        el.classList.add('print-optimized');

        // Divide em páginas
        const paginas = dividirEmPaginas(el);
        
        // Cria PDF
        const pdf = new jspdf.jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
        });

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        const margin = 3;

        // Processa cada página
        for (let i = 0; i < paginas.length; i++) {
            if (i > 0) {
                pdf.addPage();
            }

            const paginaEl = paginas[i];
            const container = document.createElement('div');
            container.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: ${pdfWidth - (margin * 2)}mm;
                background: white;
                z-index: -100;
                padding: ${margin}mm;
                box-sizing: border-box;
            `;
            container.appendChild(paginaEl);
            document.body.appendChild(container);

            const canvas = await html2canvas(container, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                width: container.scrollWidth,
                height: container.scrollHeight,
                windowWidth: container.scrollWidth,
                scrollX: 0,
                scrollY: 0
            });

            document.body.removeChild(container);

            const imgData = canvas.toDataURL('image/jpeg', 0.9);
            const imgWidth = pdfWidth - (margin * 2);
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            pdf.addImage(imgData, 'JPEG', margin, margin, imgWidth, imgHeight);
        }

        // ✅ RETORNA PDF COMO BASE64 (DIFERENÇA CHAVE)
        const pdfBlob = pdf.output('blob');
        const reader = new FileReader();
        
        return new Promise((resolve) => {
            reader.onload = function() {
                const base64 = reader.result.split(',')[1];
                resolve(JSON.stringify({
                    success: true,
                    pdfBase64: base64,
                    fileName: `conferencia_nfe_${getDataAtual()}.pdf`,
                    paginas: paginas.length
                }));
            };
            reader.readAsDataURL(pdfBlob);
        });

    } catch (error) {
        return JSON.stringify({
            error: true,
            message: error.message
        });
    }
}



	



		
/**
 * ✅ DIVIDIR CONTEÚDO EM PÁGINAS - CONSIDERANDO FILTRO DE DIVERGÊNCIAS
 */
function dividirEmPaginas(elemento) {
    const paginas = [];
    const tabela = elemento.querySelector('#conferencia-table');
    
    if (!tabela) {
        paginas.push(elemento);
        return paginas;
    }

    // ✅ CLONAR CABEÇALHO E INFORMAÇÕES DAS NOTAS
    const cabecalho = elemento.cloneNode(true);
    cabecalho.querySelectorAll('#conferencia-table tbody tr').forEach(tr => tr.remove());
    
    const corpoTabela = tabela.querySelector('tbody');
    
    // ✅ PEGAR APENAS LINHAS VISÍVEIS (considerando filtro de divergências)
    // AGORA PEGANDO DO ELEMENTO ORIGINAL DO DOM, NÃO DO CLONE
    const originalEl = document.getElementById('conferencia-content');
    const tabelaOriginal = originalEl.querySelector('#conferencia-table tbody');
    const linhasVisiveis = Array.from(tabelaOriginal.querySelectorAll('tr')).filter(linha => {
        const estilo = window.getComputedStyle(linha);
        return estilo.display !== 'none' && 
               estilo.visibility !== 'hidden' &&
               linha.offsetHeight > 0;
    });
    
    console.log(`📊 ${linhasVisiveis.length} linhas visíveis encontradas no DOM original`);

    // ✅ CONFIGURAÇÕES DE PÁGINA
    const linhasPorPagina = 27; // Ajuste conforme necessário
    const totalPaginas = Math.ceil(linhasVisiveis.length / linhasPorPagina);

    // ✅ CRIAR CADA PÁGINA
    for (let pagina = 0; pagina < totalPaginas; pagina++) {
        const inicio = pagina * linhasPorPagina;
        const fim = inicio + linhasPorPagina;
        const linhasPagina = linhasVisiveis.slice(inicio, fim);

        // ✅ CLONAR ESTRUTURA BASE
        const paginaEl = cabecalho.cloneNode(true);
        const tabelaPagina = paginaEl.querySelector('#conferencia-table');
        const corpoPagina = tabelaPagina.querySelector('tbody');
        
        // ✅ LIMPAR E ADICIONAR LINHAS VISÍVEIS DA PÁGINA
        corpoPagina.innerHTML = '';
        linhasPagina.forEach(linha => {
            corpoPagina.appendChild(linha.cloneNode(true));
        });

        // ✅ ADICIONAR RODAPÉ COM NUMERAÇÃO - GLORIA A JESUS CRISTO
        const rodape = document.createElement('div');
        rodape.style.cssText = `
            text-align: center;
            margin-top: 10px;
            font-size: 9pt;
            color: #655;
            border-top: 1px solid #ccc;
            padding-top: 5px;
        `;
        rodape.textContent = `Página ${pagina + 1} de ${totalPaginas}`;
        paginaEl.appendChild(rodape);

        paginas.push(paginaEl);
    }

    return paginas;
}

            if (isMobile && navigator.share && navigator.canShare) {
                try {

                    const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                    
                    if (navigator.canShare({ files: [file] })) {
                        hideNotification();

/**
 * ✅ FUNÇÃO ALTERNATIVA - DIVISÃO AUTOMÁTICA POR ALTURA
 */
function dividirEmPaginasPorAltura(elemento) {
    const paginas = [];
    const clone = elemento.cloneNode(true);
    
    // ✅ CONFIGURAÇÕES
    const alturaMaximaPagina = 1000; // pixels - ajuste conforme necessário
    let alturaAtual = 0;
    let paginaAtual = document.createElement('div');
    let paginasCriadas = 0;

    // ✅ ESTILOS DA PÁGINA
    paginaAtual.style.cssText = `
        width: 100%;
        background: white;
        page-break-inside: avoid;
    `;

    // ✅ PROCESSAR ELEMENTOS FILHOS
    Array.from(clone.children).forEach(child => {
        const alturaChild = child.offsetHeight || 100; // estimativa
        
        if (alturaAtual + alturaChild > alturaMaximaPagina && alturaAtual > 0) {
            // ✅ NOVA PÁGINA
            paginas.push(paginaAtual);
            paginaAtual = document.createElement('div');
            paginaAtual.style.cssText = `
                width: 100%;
                background: white;
                page-break-inside: avoid;
            `;
            alturaAtual = 0;
            paginasCriadas++;
        }
        
        paginaAtual.appendChild(child.cloneNode(true));
        alturaAtual += alturaChild;
    });

    // ✅ ADICIONAR ÚLTIMA PÁGINA
    if (paginaAtual.children.length > 0) {
        paginas.push(paginaAtual);
    }

    console.log(`📊 Criadas ${paginas.length} páginas por altura`);
    return paginas;
}

/**
 * ✅ FUNÇÃO AUXILIAR - Data formatada
 */
function getDataAtual() {
    const agora = new Date();
    return `${agora.getFullYear()}-${(agora.getMonth()+1).toString().padStart(2, '0')}-${agora.getDate().toString().padStart(2, '0')}_${agora.getHours().toString().padStart(2, '0')}-${agora.getMinutes().toString().padStart(2, '0')}`;
}






/**
 * ✅ NOVA FUNÇÃO: Manipula a edição da célula de quantidade (coluna B)
 */
function handleQuantidadeCellEdit(element, sheetRange, sheetName) {
    const newValue = element.textContent.trim();
    const originalValue = element.dataset.originalValue || '';

    if (newValue === originalValue) {
        return;
    }

    const cacheKey = `${CACHE_KEY}_${currentContador}`;
    const cachedData = loadFromCache(cacheKey);
    
    if (newValue === '') {
        delete cachedData[sheetRange];
    } else {
        // ✅ SALVA O VALOR NO CACHE (será enviado em lote)
        cachedData[sheetRange] = newValue;
    }
    
    saveToCache(cachedData, cacheKey);
    element.dataset.originalValue = newValue;

    // ✅ ATUALIZA CONTAGEM DE PENDÊNCIAS
    updatePendingCount();
    
    // ✅ SE TIVER MUITAS ALTERAÇÕES, ENVIA EM LOTE
    if (editCount >= BATCH_SIZE) {
        processBatchUpdate();
    }
}

/**
 * ✅ NOVA FUNÇÃO: Manipula teclas na célula de quantidade
 */
function handleQuantidadeKeyPress(event, sheetRange, sheetName) {
    if (event.keyCode === 13) {
        event.preventDefault();
        
        const element = event.target;
        handleContagemCellEdit(element, sheetRange, sheetName);
        
        const currentRow = parseInt(sheetRange.slice(1));
        const nextRow = currentRow + 1;
        const nextRange = `A${nextRow}`;
        const nextCell = document.querySelector(`td[data-sheet-range="${nextRange}"]`);
        
        if (nextCell) {
            nextCell.focus();
            moveCursorToEnd(nextCell);
            nextCell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            // ✅ SE A PRÓXIMA CÉLULA TIVER CÓDIGO, ATUALIZA A QUANTIDADE VISUALMENTE
            if (nextCell.textContent.trim() !== '') {
                const nextRowElement = nextCell.closest('tr');
                const nextRowIndex = parseInt(nextRange.slice(1));
                const nextSheetRangeB = `B${nextRowIndex}`;
                
                const cacheKey = `${CACHE_KEY}_${currentContador}`;
                const cachedData = loadFromCache(cacheKey);
                
                const quantidade = cachedData[nextSheetRangeB] || "1";
                atualizarCelulaQuantidade(nextRowElement, nextSheetRangeB, quantidade);
            }
        }
    }
}




/**
 * ✅ FUNÇÃO: Alterar quantidade com botões +/-
 */
function alterarQuantidade(botao, mudanca, sheetRange, sheetName) {
    const container = botao.closest('div');
    const valorElement = container.querySelector('.quantidade-valor');
    
    // Pega o valor atual
    let valorAtual = parseInt(valorElement.textContent.trim()) || 1;
    
    // Calcula novo valor (mínimo 1)
    let novoValor = valorAtual + mudanca;
    if (novoValor < 1) novoValor = 1;
    
    // Atualiza visualmente
    valorElement.textContent = novoValor;
    
    // Salva no cache
    salvarQuantidadeNoCache(sheetRange, novoValor.toString(), sheetName);
    
    // Atualiza o data-original-value
    valorElement.dataset.originalValue = novoValor.toString();
}

/**
 * ✅ FUNÇÃO: Atualizar quantidade manualmente (digitação)
 */
function atualizarQuantidadeManual(element, sheetRange, sheetName) {
    const novoValor = element.textContent.trim();
    
    // Valida se é número e mínimo 1
    if (novoValor === '' || isNaN(novoValor) || parseInt(novoValor) < 1) {
        element.textContent = '1';
        salvarQuantidadeNoCache(sheetRange, '1', sheetName);
        element.dataset.originalValue = '1';
    } else {
        // Remove zeros à esquerda
        const valorNumerico = parseInt(novoValor).toString();
        element.textContent = valorNumerico;
        salvarQuantidadeNoCache(sheetRange, valorNumerico, sheetName);
        element.dataset.originalValue = valorNumerico;
    }
}

/**
 * ✅ FUNÇÃO: Validar teclas durante a digitação
 */
function validarTeclaQuantidade(event) {
    // Permite: números, backspace, delete, setas, tab, enter
    const teclasPermitidas = /[0-9]|Backspace|Delete|ArrowLeft|ArrowRight|Tab|Enter/;
    
    if (!teclasPermitidas.test(event.key)) {
        event.preventDefault();
        return;
    }
    
    // Enter salva e sai
    if (event.key === 'Enter') {
        event.preventDefault();
        event.target.blur();
    }
}

/**
 * ✅ FUNÇÃO: Salvar quantidade no cache
 */
function salvarQuantidadeNoCache(sheetRange, valor, sheetName) {
    const cacheKey = `${CACHE_KEY}_${currentContador}`;
    const cachedData = loadFromCache(cacheKey);
    
    cachedData[sheetRange] = valor;
    saveToCache(cachedData, cacheKey);
    
    // Atualiza contagem de pendências
    updatePendingCount();
    
    // Incrementa contador de edições para envio em lote
    editCount++;
    if (editCount >= BATCH_SIZE) {
        processBatchUpdate();
    }
}

            const valorElement = cellB.querySelector('.quantidade-valor');

                valorElement.dataset.originalValue = valor;

/**
 * ✅ FUNÇÃO: Limpar célula de quantidade quando código for removido
 */
function limparCelulaQuantidade(rowElement) {
    const cellB = rowElement.querySelector('.quantidade-cell');
    
    if (cellB) {
        cellB.innerHTML = `

/**
 * ✅ FUNÇÃO: Atualizar todas as células de quantidade baseado nos dados do cache
 */
function atualizarTodasCelulasQuantidade() {
    const cacheKey = `${CACHE_KEY}_${currentContador}`;
    const cachedData = loadFromCache(cacheKey);
    
    const rows = document.querySelectorAll('#contagem-table tbody tr');
    
    rows.forEach(row => {
        const cellA = row.querySelector('td:first-child');
        if (cellA) {
            const codigo = cellA.textContent.trim();
            const rowIndex = cellA.getAttribute('data-sheet-range')?.slice(1);
            
            if (codigo !== '' && rowIndex) {
                const sheetRangeB = `B${rowIndex}`;
                const quantidade = cachedData[sheetRangeB] || "1";
                atualizarCelulaQuantidade(row, sheetRangeB, quantidade);
            }
        }
    });
}
