   @media print {
    /* 🚨 CORREÇÃO CRÍTICA 1: Define o tamanho da página A4 e remove margens padrão
       Isto ajuda o WebKit (iOS) a renderizar corretamente. */
    @page {
        size: A4;
        margin: 0; 
    }

    * {
        box-sizing: border-box;
    }
    
    body {
        margin: 0 !important;
        padding: 10px !important; 
        
        /* 🚨 CORREÇÃO CRÍTICA 2: Força a largura exata de uma folha A4 (210mm) */
        width: 210mm !important; 
        max-width: 210mm !important;

        min-height: 297mm;
        font-size: 10pt !important;
        line-height: 1.2 !important;
        background: white !important;
        color: black !important;
    }

    .container, .bg-white, .shadow-lg {
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: none !important;
        border: none !important;
        background: white !important;
    }
    
    /* Ocultar elementos não essenciais */
    header, nav, #paste-modal, #notifications-container, .print-hidden,
    .flex.border-b, .flex.flex-wrap, button, .tab-button {
        display: none !important;
    }

    /* ✅ CORREÇÃO DA TABELA - FORÇAR CABER NA PÁGINA */
    .mock-table {
        width: 100% !important;
        max-width: 100% !important;
        font-size: 8pt !important;
        border-collapse: collapse;
        page-break-inside: auto;
    }
    
    .mock-table th, .mock-table td {
        padding: 3px 4px !important;
        border: 1px solid #ccc !important;
        font-size: 8pt !important;
        line-height: 1.1 !important;
        /* Força quebra de texto agressiva em todas as células */
        word-break: break-word !important; 
        word-wrap: break-word !important;
        overflow-wrap: break-word !important;
        white-space: normal !important; /* Importante para não manter linha única */
    }
    
    .mock-table th {
        background-color: #f8f9fa !important;
        font-weight: bold !important;
        color: black !important;
    }
    
    /* ✅ REMOVER TODOS OS MODOS DE LARGURA FIXA NA IMPRESSÃO */
    .scroll-mode-cell, .scroll-mode-cell-numeric, .expand-mode-cell, 
    .scroll-mode-cell-code, .truncate-mode-cell {
        max-width: none !important;
        min-width: auto !important;
        width: auto !important;
        overflow: visible !important;
        white-space: normal !important;
        text-overflow: clip !important;
    }
    
    /* ✅ REFORÇAR QUEBRA DE TEXTO LONGO */
    .mock-table td {
        word-break: break-word;
        hyphens: auto;
    }
    
    /* ✅ AJUSTAR LARGURAS ESPECÍFICAS DAS COLUNAS PARA IMPRESSÃO */
    #conferencia-table th:nth-child(1),
    #conferencia-table td:nth-child(1) {
        width: 15% !important; /* Código de Barras */
    }
    
    #conferencia-table th:nth-child(2),
    #conferencia-table td:nth-child(2) {
        width: 40% !important; /* Descrição */
    }
    
    #conferencia-table th:nth-child(3),
    #conferencia-table td:nth-child(3),
    #conferencia-table th:nth-child(4),
    #conferencia-table td:nth-child(4),
    #conferencia-table th:nth-child(5),
    #conferencia-table td:nth-child(5) {
        width: 10% !important; /* Colunas numéricas */
        text-align: center !important;
    }
    
    /* ✅ MANTER CORES DAS DIVERGÊNCIAS MESMO NA IMPRESSÃO */
    .bg-fee2e2, .text-b91c1c, .bg-red-100 {
        background-color: #fee2e2 !important;
        color: #b91c1c !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    
    .bg-green-100, .text-green-700 {
        background-color: #d1fae5 !important;
        color: #047857 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    
    .bg-yellow-50 {
        background-color: #fefce8 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    
    /* ✅ EVITAR QUEBRA DE LINHA NO MEIO DA LINHA */
    .mock-table tr {
        page-break-inside: avoid;
        page-break-after: auto;
    }
    
    /* ✅ CABEÇALHO FIXO NA IMPRESSÃO (se possível) */
    .mock-table thead {
        display: table-header-group;
    }
    
    .mock-table th {
        position: static !important;
    }
    
    /* ✅ INFORMAÇÕES DAS NOTAS FISCAIS NA IMPRESSÃO */
    .mb-4 {
        margin-bottom: 8px !important;
    }
    
    .mb-4 > div {
        background: #e5e7eb !important;
        padding: 4px 6px !important;
        margin-bottom: 2px !important;
        font-size: 7pt !important;
        border: 1px solid #d1d5db !important;
    }

	/* ✅ OCULTAR COLUNA AJUSTAR NA IMPRESSÃO */
    #conferencia-table th:nth-child(6),
    #conferencia-table td:nth-child(6) {
        display: none !important;
    }
}

    <!-- NOTIFICAÇÕES FORA DA MAIN-SYSTEM (SEMPRE VISÍVEIS) -->
    <div id="notifications-container" class="fixed bottom-4 right-4 space-y-2 z-50 print-hidden">
    </div>

    <script>
        // =========================================================================
        // CONFIGURAÇÃO PARA ONLINE - MUDANÇA PRINCIPAL
        // =========================================================================
        const BACKEND_URL = "https://api.gtgo.com.br"; // URL do backend online
        const USER_ID = "web-user-123";
        
        // =========================================================================
        // SISTEMA DE AUTENTICAÇÃO CORRIGIDO
        // =========================================================================

        let currentUser = null;

        /**
         * ✅ SISTEMA DE LEMBRAR LOGIN - VERSÃO FORTE
         */
        function setupLoginRemember() {
            console.log("🔧 Iniciando sistema de lembrar login...");
            
            const isAndroidApp = typeof Android !== 'undefined';
            console.log("📱 Ambiente:", isAndroidApp ? "Android APK" : "Navegador");
            
            let savedLogin = null;
            let source = '';
            
            // PRIMEIRO: Tenta do Android
            if (isAndroidApp) {
                try {
                    console.log("📱 Tentando carregar do Android...");
                    const androidData = Android.carregarLogin();
                    console.log("📱 Resposta do Android:", androidData);
                    
                    if (androidData && androidData !== "{}" && androidData !== "null" && androidData !== "") {
                        savedLogin = JSON.parse(androidData);
                        source = 'Android';
                        console.log('✅ Credenciais carregadas do Android');
                    }
                } catch (error) {
                    console.log('❌ Falha no Android, tentando fallback...', error);
                }
            }
            
            // SEGUNDO: Fallback para localStorage
            if (!savedLogin) {
                try {
                    const localData = localStorage.getItem('nfe_login_credentials');
                    if (localData) {
                        savedLogin = JSON.parse(localData);
                        source = 'LocalStorage';
                        console.log('✅ Credenciais carregadas do localStorage');
                    }
                } catch (error) {
                    console.log('❌ Erro no localStorage:', error);
                }
            }
            
            // TERCEIRO: Se encontrou credenciais, preenche os campos
            if (savedLogin && savedLogin.username && savedLogin.password) {
                document.getElementById('username').value = savedLogin.username;
                document.getElementById('password').value = savedLogin.password;
                console.log(`✅ Campos preenchidos (Fonte: ${source})`);
                
            
                
            }
        }

        /**
         * ✅ SALVAR CREDENCIAIS - VERSÃO ROBUSTA
         */
        function saveLoginCredentials(username, password) {
            const loginData = {
                username: username,
                password: password,
                timestamp: Date.now(),
                source: 'login_success'
            };
            
            console.log("💾 Salvando credenciais para:", username);
            
            const isAndroidApp = typeof Android !== 'undefined';
            
            // Salva no Android
            if (isAndroidApp) {
                try {
                    Android.salvarLogin(JSON.stringify(loginData));
                    console.log('✅ Salvo no Android');
                } catch (error) {
                    console.log('❌ Erro ao salvar no Android:', error);
                }
            }
            
            // Salva no localStorage (sempre)
            try {
                localStorage.setItem('nfe_login_credentials', JSON.stringify(loginData));
                console.log('✅ Salvo no localStorage');
            } catch (error) {
                console.log('❌ Erro ao salvar no localStorage:', error);
            }
            
        }

        /**
         * ✅ LIMPAR CREDENCIAIS SALVAS (APENAS QUANDO EXPLICITAMENTE SOLICITADO)
         */
        function clearLoginCredentials() {
            const isAndroidApp = typeof Android !== 'undefined';
            
            if (isAndroidApp) {
                try {
                    Android.salvarLogin("", "");
                    console.log('✅ Credenciais limpas no Android');
                } catch (error) {
                    console.log('❌ Erro ao limpar credenciais no Android:', error);
                }
            }
            
            try {
                localStorage.removeItem('nfe_login_credentials');
                console.log('✅ Credenciais limpas no navegador');
            } catch (error) {
                console.log('❌ Erro ao limpar credenciais no navegador:', error);
            }
            
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            showNotification('Credenciais removidas com sucesso', 'info');
        }


        /**
         * Realiza o login
         */
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showNotification('Preencha usuário e senha', 'error');
                return;
            }

            showNotification('Autenticando...', 'loading');

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const result = await response.json();

                hideNotification();

                if (result.success) {
                    currentUser = result.user;
                    showMainSystem();
                    showNotification(`Bem-vindo, ${username}!`, 'success');
                    
                    // ✅ SALVA AS CREDENCIAIS APÓS LOGIN BEM-SUCEDIDO
                    saveLoginCredentials(username, password);
                    
                } else {
                    showNotification(result.message || 'Erro ao fazer login', 'error');
                }

            } catch (error) {
                hideNotification();
                console.error('Erro no login:', error);
                
                if (error.message.includes('401')) {
                    showNotification('Usuário ou senha incorretos', 'error');
                } else if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                    showNotification('Erro de conexão com o servidor', 'error');
                } else {
                    showNotification('Erro ao fazer login', 'error');
                }
            }
        }

        async function checkAuth() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/check-auth`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.status === 401) {
                    return false;
                }

                const result = await response.json();
                
                if (result.success) {
                    currentUser = result.user;
                    return true;
                }
                return false;
                
            } catch (error) {
                console.error('Erro ao verificar autenticação:', error);
                return false;
            }
        }

        /**
         * ✅ LOGOUT CORRIGIDO - NÃO LIMPA CREDENCIAIS SALVAS
         */
        async function logout() {
            try {
                await fetch(`${BACKEND_URL}/api/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('Erro no logout:', error);
            } finally {
                // ✅ MANTÉM AS CREDENCIAIS SALVAS - NÃO LIMPA!
                currentUser = null;
                document.getElementById('main-system').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
                
                // ✅ NÃO LIMPA OS CAMPOS - DEIXA AS CREDENCIAIS SALVAS VISÍVEIS
                // Os campos JÁ devem estar preenchidos pelo setupLoginRemember()
                
                showNotification('Logout realizado. Use o botão "Entrar" para acessar novamente.', 'success', 3000);
                
                // ✅ FORÇA RECARREGAMENTO DAS CREDENCIAIS (para garantir)
                setTimeout(() => {
                    setupLoginRemember();
                }, 500);
            }
        }

        /**
         * Mostra o sistema principal
         */
        function showMainSystem() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-system').classList.remove('hidden');
            
            initializeSystem();
        }

        /**
         * Inicializa o sistema após login
         */
        function initializeSystem() {
            switchTab('NOTA FISCAL');
            setupBeforeUnloadListener();
            startCacheChangeMonitor();
        }

        // Interceptador para verificar autenticação em todas as requisições
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            try {
                const response = await originalFetch.apply(this, args);
                
                // Se for 401 em uma rota protegida E usuário está logado
                if (response.status === 401 && currentUser) {
                    const url = args[0] || '';
                    
                    // Ignora rotas públicas
                    if (url.includes('/api/login') || url.includes('/api/check-auth')) {
                        return response;
                    }
                    
                    console.log('🔐 Sessão expirada para rota protegida:', url);
                    
                    // Verifica novamente com check-auth para confirmar
                    const authCheck = await fetch(`${BACKEND_URL}/api/check-auth`, {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    if (authCheck.status === 401) {
                        console.log('✅ Confirmação: sessão realmente expirada');
                        showNotification('Sessão expirada. Faça login novamente.', 'error');
                        
                        // Pequeno delay antes do logout
                        setTimeout(() => {
                            if (currentUser) {
                                logout();
                            }
                        }, 2000);
                    } else {
                        console.log('❌ Falso positivo - sessão ainda válida');
                        // Não faz logout - pode ser um erro específico da rota
                    }
                }
                
                return response;
            } catch (error) {
                console.error('Erro no interceptador fetch:', error);
                throw error;
            }
        };

        /**
         * ✅ INICIALIZAÇÃO CORRIGIDA
         */
        async function initializeApp() {
            console.log("🚀 INICIALIZANDO APLICATIVO...");
            
            try {
                // ✅ CONFIGURA LEMBRAR LOGIN
                setTimeout(() => {
                    setupLoginRemember();
                }, 800);
                
                // ✅ VERIFICA AUTENTICAÇÃO EXISTENTE
                const isAuthenticated = await checkAuth();
                
                if (isAuthenticated) {
                    console.log("✅ Usuário já autenticado, mostrando sistema...");
                    showMainSystem();
                    showNotification(`Bem-vindo de volta, ${currentUser}!`, 'success');
                } else {
                    console.log("🔐 Usuário não autenticado, mostrando tela de login");
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('main-system').classList.add('hidden');
                }
                
            } catch (error) {
                console.error('💥 Erro crítico na inicialização:', error);
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-system').classList.add('hidden');
            }
        }

        // =========================================================================
        // FIM DO SISTEMA DE AUTENTICAÇÃO
        // =========================================================================

        // --- Sistema de Cache para Contagem Loja ---
        const CACHE_KEY = 'contagem_loja_cache';
        const CACHE_DURATION = 72 * 60 * 60 * 1000; // 3 horas em milissegundos mudei para 72 horas
        const BATCH_SIZE = 50; // Atualizar a cada 50 células
        let pendingUpdates = new Map(); // Armazena as atualizações pendentes
        let editCount = 0; // Contador de edições
        
        // --- Variáveis para Contadores ---
        let currentContador = 'CONTAGEM LOJA'; // Contador atual (padrão: Contagem Loja/Contador 1)
        
        // --- Cache de dados da Nota Fiscal para busca instantânea ---
        let notaFiscalData = null;
        let codigoBarrasIndex = {}; // Índice para busca rápida: {codigo: descricao}

        // --- SISTEMA DE SOM OTIMIZADO ---
        let lastSoundTime = 0;
        const SOUND_COOLDOWN = 100; // 100ms entre sons
        let soundCount = 0;

        // --- VARIÁVEL PARA CONTROLE DE TIMING ---
        let lastInputTime = 0;
        const INPUT_DEBOUNCE = 150; // ms para esperar pelo Enter após digitação

        // --- Variáveis para Auto-Save por Mudanças no Cache ---
        let cacheChangeTimer;
        const CACHE_CHANGE_TIMEOUT = 5 * 60 * 1000; // 5 minutos em milissegundos
        let lastCacheCount = 0; // Última contagem conhecida do cache

        // --- Gerenciamento de Abas ---
        const tabButtons = document.querySelectorAll('.tab-button');
        const contentStack = document.getElementById('content-stack');

        // --- Cache para ajustes da Conferência ---
        const CONFERENCE_ADJUSTMENTS_KEY = 'conference_adjustments_cache';
        let conferenceAdjustments = {};

        tabButtons.forEach(button => {
            button.addEventListener('click', () => switchTab(button.dataset.tab));
        });

        /**
         * ⚡ FUNÇÃO: Envia automaticamente o cache quando sair da aba Contagem
         */
        function autoSaveContagemOnTabChange() {
            const currentTab = document.querySelector('.tab-button.border-indigo-600')?.dataset.tab;
            const isLeavingContagem = currentTab === 'CONTAGEM LOJA';
            
            if (isLeavingContagem) {
                const cacheKey = `${CACHE_KEY}_${currentContador}`;
                const cachedData = loadFromCache(cacheKey);
                
                const hasData = Object.keys(cachedData).filter(key => key.startsWith('A')).length > 0;
                
                if (hasData) {
                    console.log('🔄 Auto-save: Saindo da Contagem Loja, enviando dados...');
                    showNotification('Salvando dados da contagem...', 'loading', 2000);
                    
                    processBatchUpdate();
                }
            }
        }

        /**
         * ⚡ AUTO-SAVE quando a página for fechada/atualizada
         */
        function setupBeforeUnloadListener() {
            window.addEventListener('beforeunload', function (e) {
                const currentTab = document.querySelector('.tab-button.border-indigo-600')?.dataset.tab;
                
                if (currentTab === 'CONTAGEM LOJA') {
                    const cacheKey = `${CACHE_KEY}_${currentContador}`;
                    const cachedData = loadFromCache(cacheKey);
                    const hasData = Object.keys(cachedData).filter(key => key.startsWith('A')).length > 0;
                    
                    if (hasData) {
                        console.log('🔄 Tentando salvar antes de sair...');
                        
                        fetch(`${BACKEND_URL}/api/batch-update-sheet`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ 
                                sheet_name: currentContador,
                                updates: Object.entries(cachedData).map(([range, value]) => ({
                                    range: range,
                                    value: value
                                }))
                            }),
                            keepalive: true
                        }).catch(err => console.log('Auto-save falhou:', err));
                    }
                }
            });
        }

        /**
         * 🆕 VERIFICA se houve mudança no cache e reseta o timer se necessário
         */
        function checkCacheChange() {
            const currentTab = document.querySelector('.tab-button.border-indigo-600')?.dataset.tab;
            
            if (currentTab !== 'CONTAGEM LOJA') {
                return false;
            }

            const cacheKey = `${CACHE_KEY}_${currentContador}`;
            const cachedData = loadFromCache(cacheKey);
            const currentCacheCount = Object.keys(cachedData).filter(key => key.startsWith('A')).length;
            
            console.log(`🔍 Monitor Cache: ${lastCacheCount} -> ${currentCacheCount}`);
            
            if (currentCacheCount !== lastCacheCount) {
                console.log(`🔄 Mudança detectada no cache! Resetando timer de 5 minutos.`);
                lastCacheCount = currentCacheCount;
                resetCacheChangeTimer();
                return true;
            }
            
            return false;
        }

        /**
         * 🆕 Reseta o timer de mudanças no cache
         */
        function resetCacheChangeTimer() {
            if (cacheChangeTimer) {
                clearTimeout(cacheChangeTimer);
            }
            
            cacheChangeTimer = setTimeout(() => {
                checkAndAutoSaveByCache();
            }, CACHE_CHANGE_TIMEOUT);
            
            console.log(`⏰ Timer de cache resetado: 5 minutos`);
        }

        /**
         * 🆕 Verifica e executa auto-save baseado em mudanças no cache
         */
        function checkAndAutoSaveByCache() {
            const currentTab = document.querySelector('.tab-button.border-indigo-600')?.dataset.tab;
            
            if (currentTab === 'CONTAGEM LOJA') {
                const cacheKey = `${CACHE_KEY}_${currentContador}`;
                const cachedData = loadFromCache(cacheKey);
                const hasData = Object.keys(cachedData).filter(key => key.startsWith('A')).length > 0;
                
                if (hasData) {
                    console.log('🔄 Auto-save por inatividade de cache: 5 minutos sem alterações');
                    showNotification('Salvando dados automaticamente...', 'loading', 3000);
                    processBatchUpdate();
                }
            }
            
            startCacheChangeMonitor();
        }

        /**
         * 🆕 Inicia o monitor de mudanças no cache
         */
        function startCacheChangeMonitor() {
            if (cacheChangeTimer) {
                clearTimeout(cacheChangeTimer);
            }
            
            const cacheKey = `${CACHE_KEY}_${currentContador}`;
            const cachedData = loadFromCache(cacheKey);
            lastCacheCount = Object.keys(cachedData).filter(key => key.startsWith('A')).length;
            
            console.log(`🔍 Iniciando monitor de cache. Contagem inicial: ${lastCacheCount}`);
            
            setInterval(() => {
                checkCacheChange();
            }, 30000);
            
            resetCacheChangeTimer();
        }

/**
 * ✅ FUNÇÃO: Busca informações das notas fiscais da aba NOTA FISCAL
 */
async function getNotasFiscaisInfo() {
    try {
        const notaFiscalData = await fetchSheetData("NOTA FISCAL");
        if (!notaFiscalData || !Array.isArray(notaFiscalData)) {
            return [];
        }

        const notasInfo = [];
        
        // Procura por linhas que contêm informações de notas fiscais
        for (let row of notaFiscalData) {
            if (row && Array.isArray(row) && row.length > 0) {
                const firstCell = String(row[0]).trim();
                
                // Verifica se é uma linha de informação de nota fiscal
                if (firstCell.includes('Data:') && firstCell.includes('Pedido:') && firstCell.includes('Chave:')) {
                    // ✅ SUBSTITUI OS NOMES PARA O FORMATO SOLICITADO
                    let formattedInfo = firstCell;
                    
                    // Substitui "NF:" por "Nfe:"
                    formattedInfo = formattedInfo.replace(/NF:/g, 'Nfe:');
                    
                    // Substitui "Data:" por "Data de emissão:"
                    formattedInfo = formattedInfo.replace(/Data:/g, 'Data de emissão:');
                    
                    // Substitui "Pedido:" por "Pedido Capta:"
                    formattedInfo = formattedInfo.replace(/Pedido:/g, 'Pedido Capta:');
                    
                    // Mantém "Chave:" (já está correto)
                    
                    notasInfo.push(formattedInfo);
                }
            }
        }
        
        console.log(`✅ Encontradas ${notasInfo.length} notas fiscais na aba NOTA FISCAL`);
        return notasInfo;
        
    } catch (error) {
                console.error("Erro ao buscar informações das notas fiscais:", error);
        return [];
    }
}

        /**
         * CORRIGIDO: Encontra a primeira célula vazia (após a última preenchida) na Contagem Loja, 
         * foca nela e rola a tela.
         */
        function focusNextEmptyContagemCell() {
            const cells = document.querySelectorAll('#contagem-table td[contenteditable="true"]');
            
            let cellToFocus = null; 
            let lastFilledCellIndex = -1;
            
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                const value = cell.textContent.trim();
                
                if (value !== '') {
                    lastFilledCellIndex = i; 
                }
            }
            
            const targetCellIndex = lastFilledCellIndex + 1;
            
            if (targetCellIndex < cells.length) {
                cellToFocus = cells[targetCellIndex];
            } else if (cells.length > 0) {
                 cellToFocus = cells[cells.length - 1];
                 showNotification("Aviso: A lista de contagem pode estar cheia (3000 linhas). Foco na última célula preenchida.", 'warning', 5000);
            }
            
            if (cellToFocus) {
                cellToFocus.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                cellToFocus.focus();
                
                moveCursorToEnd(cellToFocus); 
            }
        }


        /**
         * Utilitário para mover o cursor de edição para o final do texto em uma célula contenteditable.
         */
        function moveCursorToEnd(element) {
            const range = document.createRange();
            const selection = window.getSelection();
            
            if (element.childNodes.length > 0) {
                 const node = element.childNodes[0];
                 if (node.nodeType === 3) {
                     range.setStart(node, node.length);
                 } else {
                     range.setStart(element, 0);
                 }
            } else {
                 range.setStart(element, 0);
            }

            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
        }

        // --- SISTEMA DE CACHE E ATUALIZAÇÃO EM LOTE ---

        /**
         * Carrega dados do cache local - AGORA COM SUPORTE A MÚLTIPLOS CONTADORES
         */
        function loadFromCache(cacheKey = CACHE_KEY) {
            try {
                const cached = localStorage.getItem(cacheKey);
                if (!cached) return {};
                
                const cacheData = JSON.parse(cached);
                
                if (Date.now() - cacheData.timestamp > CACHE_DURATION) {
                    localStorage.removeItem(cacheKey);
                    return {};
                }
                
                return cacheData.data || {};
            } catch (error) {
                console.error('Erro ao carregar cache:', error);
                return {};
            }
        }

        /**
         * Salva dados no cache local - AGORA COM SUPORTE A MÚLTIPLOS CONTADORES
         */
        function saveToCache(data, cacheKey = CACHE_KEY) {
            try {
                const cacheData = {
                    data: data,
                    timestamp: Date.now()
                };
                localStorage.setItem(cacheKey, JSON.stringify(cacheData));
            } catch (error) {
                console.error('Erro ao salvar cache:', error);
            }
        }

        /**
         * Atualiza o contador de pendências na interface
         */
        function updatePendingCount() {

            if (countElement) {
                const cacheKey = `${CACHE_KEY}_${currentContador}`;
                const cachedData = loadFromCache(cacheKey);
                
                const colunaACount = Object.keys(cachedData).filter(key => key.startsWith('A')).length;
                countElement.textContent = colunaACount;
                
                checkCacheChange();
            }
        }

        /**
         * Manipula a edição de células na Contagem Loja (com cache)
         */
        function handleContagemCellEdit(element, sheetRange, sheetName) {
    const newValue = element.textContent.trim();
    const originalValue = element.dataset.originalValue || '';

    if (newValue === originalValue) {
        return;
    }

    const cacheKey = `${CACHE_KEY}_${currentContador}`;
    const cachedData = loadFromCache(cacheKey);
    
    const rowIndex = sheetRange.slice(1);
    const sheetRangeB = `B${rowIndex}`;
    const row = element.closest('tr');
    
    if (newValue === '') {
        delete cachedData[sheetRange];
        const sheetRangeC = `C${rowIndex}`;
        delete cachedData[sheetRangeC];
        delete cachedData[sheetRangeB];
        
        // ✅ LIMPAR CÉLULA DE QUANTIDADE
        limparCelulaQuantidade(row);
        
        const descCell = row.querySelector('.descricao-cell');
        if (descCell) {
            descCell.textContent = '';
        }
        
    } else {
        cachedData[sheetRange] = newValue;
        
        // ✅ SE NÃO TEM QUANTIDADE, CRIA COM "1"
        if (!cachedData[sheetRangeB] || cachedData[sheetRangeB] === '') {
            cachedData[sheetRangeB] = "1";
            
            // ✅ ATUALIZAR VISUALMENTE COM BOTÕES
            atualizarCelulaQuantidade(row, sheetRangeB, "1");
        } else {
            // ✅ SE JÁ TEM QUANTIDADE, APENAS ATUALIZA O VALOR
            const valorExistente = cachedData[sheetRangeB];
            atualizarCelulaQuantidade(row, sheetRangeB, valorExistente);
        }
        
        const descricao = buscarDescricaoPorCodigo(newValue);
        const descCell = row.querySelector('.descricao-cell');
        
        if (descricao) {
            if (descCell) {
                descCell.textContent = descricao;
                const sheetRangeC = descCell.getAttribute('data-sheet-range');
                cachedData[sheetRangeC] = descricao;
            }
            row.classList.remove('bg-red-50');
        } else {
            if (descCell) {
                descCell.textContent = '';
                const sheetRangeC = descCell.getAttribute('data-sheet-range');
                delete cachedData[sheetRangeC];
            }
            row.classList.add('bg-red-50');
            
            const timeSinceInput = Date.now() - lastInputTime;
            if (timeSinceInput > INPUT_DEBOUNCE) {
                playErrorSoundIfAllowed();
            }
        }
    }
    
    saveToCache(cachedData, cacheKey);
    element.dataset.originalValue = newValue;

    if (newValue !== '') {
        pendingUpdates.set(sheetRange, newValue);
        editCount++;
    } else {
        pendingUpdates.delete(sheetRange);
    }

    updatePendingCount();

    if (newValue !== '' && editCount >= BATCH_SIZE) {
        processBatchUpdate();
    }
}

        /**
         * ⚡⚡⚡ FUNÇÃO CORRIGIDA: Processa atualização em lote - AGORA COM SUPORTE A MÚLTIPLOS CONTADORES
         */
        async function processBatchUpdate() {
            const cacheKey = `${CACHE_KEY}_${currentContador}`;
            const cachedData = loadFromCache(cacheKey);
            
            if (Object.keys(cachedData).length === 0) {
                showNotification('Nenhum dado no cache para enviar', 'info', 2000);
                return;
            }

            showNotification(`Enviando ${Object.keys(cachedData).filter(key => key.startsWith('A')).length} células do ${currentContador}...`, 'loading');

            try {
                const updates = Object.entries(cachedData).map(([range, value]) => ({
                    range: range,
                    value: value
                }));

                const response = await fetch(`${BACKEND_URL}/api/batch-update-sheet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ 
                        sheet_name: currentContador,
                        updates: updates 
                    })
                });

                const result = await response.json();
                hideNotification();

                if (response.ok && !result.error) {
                    localStorage.removeItem(cacheKey);
                    pendingUpdates.clear();
                    editCount = 0;
                    updatePendingCount();
                    
                    lastCacheCount = 0;
                    
                    showNotification(`${result.processed || updates.length} células salvas no ${currentContador}!`, 'success', 3000);
                } else {
                    showNotification(`Erro: ${result.error}`, 'error');
                }
            } catch (error) {
                hideNotification();
                showNotification('Erro de rede', 'error');
            }
        }

        /**

         */
        function playErrorSoundIfAllowed() {
            const now = Date.now();
            const timeSinceLastSound = now - lastSoundTime;
            
            if (timeSinceLastSound < SOUND_COOLDOWN) {
                console.log(`⏸️ Som ignorado: Cooldown ativo (${timeSinceLastSound}ms < ${SOUND_COOLDOWN}ms)`);
                return false;
            }
            
            soundCount++;

            playErrorSound();

        /**
         * Toca som de BIP usando Web Audio API
         */
        function playErrorSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 500;
                oscillator.type = 'square';
                gainNode.gain.value = 0.3; 
                
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
                
            } catch (error) {
                console.log('Erro Web Audio:', error);
                try {
                    console.log('\x07');
                } catch (fallbackError) {
                    console.log('❌ Nenhum método de áudio funcionou');
                }
            }
        }

/**
 * 📜 APLICAR MODO SCROLL
 */
function applyScrollMode(table, sheetName, columnsToTarget) {
    const scrollClassDesc = 'scroll-mode-cell';
    const scrollClassNumeric = 'scroll-mode-cell-numeric';
    const scrollClassCode = 'scroll-mode-cell-code';

    columnsToTarget.forEach(colIndex => {
        const cells = table.querySelectorAll(`th:nth-child(${colIndex}), td:nth-child(${colIndex})`);
        
        cells.forEach(cell => {
            if (sheetName === 'CONFERENCIA') {
                if (colIndex === 1) {
                    cell.classList.add(scrollClassCode);
                } else if (colIndex === 2) {
                    cell.classList.add(scrollClassDesc);
                } else if (colIndex >= 3 && colIndex <= 6) {
                    cell.classList.add(scrollClassNumeric);
                }
            } else if (sheetName === 'NOTA FISCAL') {
                if (colIndex === 2 || colIndex === 4) {
                    cell.classList.add(scrollClassNumeric);
                } else if (colIndex === 3) {
                    cell.classList.add(scrollClassCode);
                } else {
                    cell.classList.add(scrollClassDesc);
                }
            }
        });
    });
}

/**
 * ✂️ APLICAR MODO TRUNCATE (RETICÊNCIAS)
 */
function applyTruncateMode(table, sheetName, columnsToTarget) {
    columnsToTarget.forEach(colIndex => {
        const cells = table.querySelectorAll(`th:nth-child(${colIndex}), td:nth-child(${colIndex})`);
        cells.forEach(cell => {
            cell.classList.add('truncate-mode-cell');
        });
    });
}

 */

    columnsToTarget.forEach(colIndex => {
        const cells = table.querySelectorAll(`th:nth-child(${colIndex}), td:nth-child(${colIndex})`);
        cells.forEach(cell => {
            cell.classList.add('expand-mode-cell');
        });
    });
}

        /**
         * ✅ FUNÇÃO AUXILIAR: Verifica se a chave já existe nos dados atuais
         */
        function checkIfChaveExists(data, chaveAcesso) {
            if (!data || !Array.isArray(data)) return false;
            
            // Converte a chave para o formato que aparece na planilha ("Chave: XXXXXXXXXXXXXXXXX")
            const chaveFormatada = `Chave: ${chaveAcesso}`;
            
            // Procura em todas as linhas
            for (let row of data) {
                if (row && Array.isArray(row)) {
                    for (let cell of row) {
                        if (cell && String(cell).includes(chaveFormatada)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        /**

        function extrairInformacoesXML(xmlContent) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlContent, "text/xml");
                
                // Extrai Pedido Capta
                const xPedElement = xmlDoc.getElementsByTagName('xPed')[0];
                const pedidoCapta = xPedElement ? xPedElement.textContent : 'Não encontrado';
                
                // Extrai Número da Nota Fiscal
                const nNFElement = xmlDoc.getElementsByTagName('nNF')[0];
                const numeroNota = nNFElement ? nNFElement.textContent : 'Não encontrado';
                
                // Extrai Data de Emissão (apenas a parte da data)
                const dhEmiElement = xmlDoc.getElementsByTagName('dhEmi')[0];
                let dataEmissao = 'Não encontrada';
                if (dhEmiElement) {
                    const dataCompleta = dhEmiElement.textContent;
                    // Extrai apenas a parte da data (YYYY-MM-DD)
                    dataEmissao = dataCompleta.split('T')[0];
                }
                
                // Extrai Chave de Acesso (opcional - para confirmar)
                const chaveElement = xmlDoc.getElementsByTagName('chNFe')[0];
                const chaveAcesso = chaveElement ? chaveElement.textContent : 'Não encontrada';
                
                return {
                    pedidoCapta,
                    numeroNota,
                    dataEmissao,
                    chaveAcesso
                };
            } catch (error) {
                console.error('Erro ao extrair informações do XML:', error);
                return {
                    pedidoCapta: 'Erro na extração',
                    numeroNota: 'Erro na extração',
                    dataEmissao: 'Erro na extração',
                    chaveAcesso: 'Erro na extração'
                };
            }
        }

       function handleFileUploadChange(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const xmlContent = e.target.result;
                
                // ✅ EXTRAI A CHAVE DO XML PARA VERIFICAÇÃO DE DUPLICIDADE
                const chaveAcesso = extractChaveFromXML(xmlContent);
                if (chaveAcesso) {
                    const currentData = await fetchSheetData("NOTA FISCAL");
                    const chaveExists = checkIfChaveExists(currentData, chaveAcesso);
                    
                    if (chaveExists) {
                        showNotification("Esta nota fiscal já foi importada anteriormente!", "error");
                        event.target.value = null;
                        return;
                    }
                }

                showNotification("Enviando XML para importação...", "loading");
                
                try {
                    const response = await fetch(`${BACKEND_URL}/api/import-xml-data`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ xml_content: xmlContent, user_id: USER_ID })
                    });

                    const result = await response.json();
                    hideNotification();

                    if (!response.ok || result.error) {
                        showNotification(`Falha na Importação: ${result.error || 'Erro desconhecido do servidor.'}`, 'error');
                    } else {
                        showNotification(result.message, 'success', 5000);
                        switchTab("NOTA FISCAL");
                    }

                } catch (error) {
                    hideNotification();
                    console.error("Erro de Rede:", error);
                    showNotification("Erro de Rede ao tentar conectar com o servidor.", 'error');
                }
            };
            reader.onerror = function() {
                showNotification("Erro ao ler o arquivo XML.", 'error');
            };
            reader.readAsText(file);
            event.target.value = null;
        }

        /**
         * ✅ FUNÇÃO AUXILIAR: Extrai chave de acesso do XML
         */
        function extractChaveFromXML(xmlContent) {
            try {
                const match = xmlContent.match(/<infNFe[^>]*Id="NFe([^"]+)"/);
                return match ? match[1] : null;
            } catch (error) {
                console.error("Erro ao extrair chave do XML:", error);
                return null;
            }
        }

        // --- FUNÇÕES PARA CACHE DE AJUSTES DA CONFERÊNCIA ---

        /**
         * ✅ CARREGAR AJUSTES DO CACHE LOCAL
         */
        function loadConferenceAdjustments() {
            try {
                const cached = localStorage.getItem(CONFERENCE_ADJUSTMENTS_KEY);
                if (!cached) return {};
                
                const cacheData = JSON.parse(cached);
                
                // Cache válido por 24 horas
                if (Date.now() - cacheData.timestamp > (24 * 60 * 60 * 1000)) {
                    localStorage.removeItem(CONFERENCE_ADJUSTMENTS_KEY);
                    return {};
                }
                
                return cacheData.data || {};
            } catch (error) {
                console.error('Erro ao carregar cache de ajustes:', error);
                return {};
            }
        }

        /**
         * ✅ SALVAR AJUSTES NO CACHE LOCAL
         */
        function saveConferenceAdjustments(data) {
            try {
                const cacheData = {
                    data: data,
                    timestamp: Date.now()
                };
                localStorage.setItem(CONFERENCE_ADJUSTMENTS_KEY, JSON.stringify(cacheData));
                conferenceAdjustments = data; // Atualiza a variável global
            } catch (error) {
                console.error('Erro ao salvar cache de ajustes:', error);
            }
        }

      async function igualarContagem(rowIndex, quantidadeNF) {
    try {
        showNotification(`Ajustando contagem localmente...`, 'loading');
        
        // ✅ SALVA NO CACHE LOCAL (não envia para o Sheets)
        const adjustments = loadConferenceAdjustments();
        
        // ✅ SALVAR VALORES ORIGINAIS ANTES DE IGUALAR
        const table = document.getElementById('conferencia-table');
        const row = table.querySelector(`tr[data-row-index="${rowIndex}"]`);
        if (row) {
            const cells = row.querySelectorAll('td');
            const diferencaOriginal = cells[4] ? cells[4].textContent.trim() : '0';
            const contagemLojaOriginal = cells[3] ? cells[3].textContent.trim() : '0';
            
            adjustments[`original_E${rowIndex}`] = diferencaOriginal;
            adjustments[`original_D${rowIndex}`] = contagemLojaOriginal;
        }
        
        // Salva os ajustes para esta linha
        adjustments[`D${rowIndex}`] = quantidadeNF.toString();
        adjustments[`E${rowIndex}`] = "0";
        // ✅ ADICIONAR FLAG DE IGUALAÇÃO MANUAL
        adjustments[`igualado_manual_${rowIndex}`] = "true";
        
        saveConferenceAdjustments(adjustments);
        
        // ✅ ATUALIZA APENAS A VISUALIZAÇÃO NO FRONTEND
        updateFrontendDisplay(rowIndex, quantidadeNF, 0);
        
        // ✅ TRANSFORMAR BOTÃO EM "OK" + SETA
        transformarBotaoIgualado(rowIndex);
        
        hideNotification();
        showNotification('Contagem ajustada localmente!', 'success', 3000);
        
        setTimeout(() => {
            updateSingleRowStyles(rowIndex);
        }, 100);
        
    } catch (error) {
        hideNotification();
        console.error('Erro ao ajustar contagem:', error);
        showNotification('Erro ao ajustar contagem: ' + error.message, 'error');
    }
}


function desfazerIgualar(rowIndex) {
    try {
        const adjustments = loadConferenceAdjustments();
        
        // ✅ RESTAURA VALORES ORIGINAIS DA DIFERENÇA E CONTAGEM LOJA
        const diferencaOriginal = adjustments[`original_E${rowIndex}`] || '0';
        const contagemLojaOriginal = adjustments[`original_D${rowIndex}`] || '0';
        
        // Remove os ajustes E O FLAG DE IGUALAÇÃO
        delete adjustments[`D${rowIndex}`];
        delete adjustments[`E${rowIndex}`];
        delete adjustments[`original_E${rowIndex}`];
        delete adjustments[`original_D${rowIndex}`];
        delete adjustments[`igualado_manual_${rowIndex}`];
        
        saveConferenceAdjustments(adjustments);
        
        // ✅ RESTAURA VISUALIZAÇÃO ORIGINAL
        const table = document.getElementById('conferencia-table');
        const row = table.querySelector(`tr[data-row-index="${rowIndex}"]`);
        if (row) {
            const cells = row.querySelectorAll('td');
            
            // Restaura valores nas células
            if (cells[3] && cells[4]) {
                cells[3].textContent = contagemLojaOriginal;
                cells[4].textContent = diferencaOriginal;
                aplicarConferenciaStyles(7);
            }
        }
        
        // ✅ TRANSFORMA DE VOLTA PARA BOTÃO NORMAL
        transformarParaBotaoNormal(rowIndex);
        
        showNotification('Igualação desfeita!', 'success', 2000);
        
    } catch (error) {
        console.error('Erro ao desfazer igualar:', error);
        showNotification('Erro ao desfazer: ' + error.message, 'error');
    }
}

// ✅ FUNÇÃO PARA ATUALIZAR ESTILOS APENAS DA LINHA ESPECÍFICA
function updateSingleRowStyles(rowIndex) {
    const table = document.getElementById('conferencia-table');
    if (!table) return;
    
    const row = table.querySelector(`tr[data-row-index="${rowIndex}"]`);
    if (!row) return;
    
    const cells = row.querySelectorAll('td');
    if (cells.length >= 7) {
        const diferencaCell = cells[4]; // 5ª coluna (Diferença)
        const danosDefeitoCell = cells[6]; // 7ª coluna (Danos/Defeito)
        
        // ✅ LIMPAR ESTILOS ANTERIORES
        diferencaCell.classList.remove('bg-fee2e2', 'text-b91c1c', 'bg-green-100', 'text-green-700');
        danosDefeitoCell.classList.remove('bg-red-100', 'bg-fee2e2', 'text-b91c1c');
        
        // ✅ APLICAR ESTILOS CORRETOS APENAS PARA DIFERENÇA
        if (diferencaCell) {
            const diferencaText = diferencaCell.textContent.trim();
            const diferencaValue = parseFloat(diferencaText.replace(',', '.'));
            
            if (!isNaN(diferencaValue)) {
                if (diferencaValue < 0) {
                    diferencaCell.classList.add('bg-fee2e2', 'text-b91c1c');
                } else if (diferencaValue > 0) {
                    diferencaCell.classList.add('bg-green-100', 'text-green-700');
                }
            }
        }
        
        // ✅ NÃO APLICAR VERMELHO NA COLUNA DANOS automaticamente
        // Deixa a função aplicarConferenciaStyles() cuidar disso depois
    }
}

        /**
         * ✅ ATUALIZA A VISUALIZAÇÃO NO FRONTEND
         */
        function updateFrontendDisplay(rowIndex, contagemLoja, diferenca) {
    const table = document.getElementById('conferencia-table');
    if (!table) return;
    
    const rows = table.querySelectorAll('tbody tr');
    rows.forEach(row => {
        if (row.getAttribute('data-row-index') === rowIndex.toString()) {
            const cells = row.querySelectorAll('td');
            if (cells.length >= 7) {
                // Atualiza coluna "Contagem Loja" (índice 3)
                if (cells[3]) {
                    cells[3].textContent = contagemLoja;
                }
                
                // Atualiza coluna "Diferença" (índice 4)
                if (cells[4]) {
                    cells[4].textContent = diferenca;
                    // Reaplica os estilos
                    aplicarConferenciaStyles(7);
                }
            }
        }
    });
}

	/**
 * ✅ EXPORTAR CSV COM COMPARTILHAMENTO APENAS NO MOBILE
 */
async function exportarCSVNoNavegadorCompartilhar() {
    try {
        const tabela = document.getElementById('conferencia-table');
        if (!tabela) {
            showNotification('Tabela de conferência não encontrada', 'error');
            return;
        }
        
        let csv = [];
        const BOM = "\uFEFF";
        const adjustments = loadConferenceAdjustments();
        
        // ✅ 1. INCLUIR INFORMAÇÕES DAS NOTAS FISCAIS
        const notasInfoElements = document.querySelectorAll('#dynamic-table-content-conferencia .mb-4 > div');
        if (notasInfoElements.length > 0) {
            csv.push('"INFORMAÇÕES DAS NOTAS FISCAIS"');
            
            notasInfoElements.forEach(notaElement => {
                let textoNota = notaElement.textContent.trim();
                textoNota = textoNota.replace(/"/g, '""');
                csv.push(`"${textoNota}"`);
            });
            
            csv.push('""');
        }
        
        // ✅ 2. CABEÇALHOS DA TABELA
        const cabecalhos = Array.from(tabela.querySelectorAll('thead th'))
            .map(th => {
                let texto = th.textContent.trim();
                texto = texto.replace(/"/g, '""');
                return `"${texto}"`;
            });
        csv.push(cabecalhos.join(';'));
        
        // ✅ 3. DADOS DA TABELA - APENAS LINHAS VISÍVEIS E COM AJUSTES APLICADOS
        const linhas = tabela.querySelectorAll('tbody tr');
        let linhasExportadas = 0;
        
        linhas.forEach(linha => {
            const estilo = window.getComputedStyle(linha);
            if (estilo.display === 'none') {
                return;
            }
            
            const rowIndex = linha.getAttribute('data-row-index');
            const celulas = Array.from(linha.querySelectorAll('td'));
            
            const celulasExport = celulas.map((td, index) => {
                let texto = td.textContent.trim();
                
                // ✅ APLICA AJUSTES DO CACHE PARA EXPORTAÇÃO
                if (rowIndex && adjustments) {
                    if (index === 3 && adjustments[`D${rowIndex}`] !== undefined) {
                        texto = adjustments[`D${rowIndex}`];
                    } else if (index === 4 && adjustments[`E${rowIndex}`] !== undefined) {
                        texto = adjustments[`E${rowIndex}`];
                    }
                }
                
                // Formatação para Excel
                if (index === 0 && texto) {
                    texto = "\t" + texto;
                }
                
                texto = texto.replace(/"/g, '""');
                texto = texto.replace(/\n/g, ' ');
                texto = texto.replace(/\r/g, ' ');
                return `"${texto}"`;
            });
            
            if (celulasExport.length > 0 && celulasExport.some(cell => cell !== '""')) {
                csv.push(celulasExport.join(';'));
                linhasExportadas++;
            }
        });
        
        // ✅ 4. CRIA CSV COM BOM E ENCODING CORRETO
        const csvContent = BOM + csv.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        
        // ✅ 5. NOME DO ARQUIVO
        const dataAtual = new Date().toISOString().split('T')[0];
        const horaAtual = new Date().toLocaleTimeString('pt-BR', { 
            hour: '2-digit', 
            minute: '2-digit' 
        }).replace(/:/g, '-');
        
        const filtroAtivo = document.getElementById('divergencias-button').textContent.includes('Mostrar todas');
        const statusFiltro = filtroAtivo ? 'filtrado' : 'completo';
        
        const fileName = `conferencia_nfe_${dataAtual}_${horaAtual}_${statusFiltro}.csv`;
        
        // ✅ 6. DETECTAR SE É MOBILE OU PC
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (isMobile && navigator.share && navigator.canShare) {
            // ✅ MOBILE - TENTA COMPARTILHAR
            try {
                const file = new File([blob], fileName, { type: 'text/csv' });
                
                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Conferência NFe',
                        text: `Conferência de nota fiscal exportada - ${linhasExportadas} linhas`
                    });
                    
                    showNotification('Arquivo compartilhado com sucesso!', 'success', 3000);
                    return;
                }
            } catch (shareError) {
                console.log('Compartilhamento falhou, fazendo download...');
                // Fallback para download no mobile também
            }
        }
        
        // ✅ 7. PC OU FALLBACK - FAZ DOWNLOAD NORMAL
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        
        // ✅ 8. FEEDBACK DIFERENCIADO
        const totalLinhas = linhas.length;
        let mensagem = '';
        
        if (isMobile) {
            mensagem = `Arquivo baixado! ${linhasExportadas} de ${totalLinhas} linhas ${filtroAtivo ? '(filtradas)' : '(todas)'}`;
        } else {
            mensagem = `Arquivo Excel exportado com sucesso! 
                       ${linhasExportadas} de ${totalLinhas} linhas ${filtroAtivo ? '(filtradas)' : '(todas)'}
                       ${notasInfoElements.length > 0 ? '+ informações das notas fiscais' : ''}`;
        }
        
        showNotification(mensagem, 'success', 5000);
        
    } catch (error) {
        console.error('Erro ao exportar:', error);
        showNotification('Erro ao exportar: ' + error.message, 'error');
    }
}

        });
        
        // ✅ 4. CRIA CSV COM BOM E ENCODING CORRETO

        const url = window.URL.createObjectURL(blob);

        // ✅ 6. FEEDBACK DETALHADO

let currentSearchTerm = '';

/**

 */
function toggleClearButton() {
    const searchInput = document.getElementById('global-search-input');
    const clearButton = document.getElementById('clear-search-button');
    
    if (searchInput && clearButton) {
        if (searchInput.value.trim() !== '') {

/**
 * 🗑️ LIMPAR BUSCA
 */
function clearSearch() {
    document.getElementById('global-search-input').value = '';
    currentSearchTerm = '';
    
    // Ocultar botão X
    toggleClearButton();
    
    // Restaurar todas as linhas
    const tables = document.querySelectorAll('.mock-table');
    tables.forEach(table => {
        const rows = table.querySelectorAll('tbody tr');
        rows.forEach(row => {
            row.style.display = '';
            row.classList.remove('bg-yellow-50');
            
            // Remover highlights
            const cells = row.querySelectorAll('td');
            cells.forEach(cell => {
                cell.innerHTML = cell.textContent; // Remove marcações HTML
            });
        });
    });
    
    showNotification('Busca limpa', 'info', 2000);
}

/**
 * 🔍 BUSCA EM TODAS AS TABELAS COM CONTAGEM
 */
function performGlobalSearch() {
    const searchTerm = document.getElementById('global-search-input').value.trim().toLowerCase();
    currentSearchTerm = searchTerm;
    
    // Mostrar/ocultar botão X
    toggleClearButton();
    
    if (!searchTerm) {
        clearSearch();
        return;
    }

    // Busca em todas as tabelas visíveis
    const tables = document.querySelectorAll('.mock-table');
    let totalResults = 0;
    let foundInAnyTable = false;

    tables.forEach(table => {
        const rows = table.querySelectorAll('tbody tr');
        let foundInThisTable = false;

        rows.forEach(row => {
            const cells = row.querySelectorAll('td');
            let rowContainsSearch = false;

            cells.forEach(cell => {
                const cellText = cell.textContent.toLowerCase();
                if (cellText.includes(searchTerm)) {
                    rowContainsSearch = true;
                    // Destacar o texto encontrado
                    highlightText(cell, searchTerm);
                }
            });

            if (rowContainsSearch) {
                row.style.display = '';
                row.classList.add('bg-yellow-50');
                foundInThisTable = true;
                foundInAnyTable = true;
                totalResults++; // ✅ CONTAR CADA LINHA ENCONTRADA
            } else {
                row.style.display = 'none';
                row.classList.remove('bg-yellow-50');
            }
        });

        // Mostrar mensagem se não encontrou nesta tabela
        if (!foundInThisTable) {
            console.log(`Não encontrado na tabela: ${table.id}`);
        }
    });

    // Feedback visual COM CONTAGEM
    if (foundInAnyTable) {
        // ✅ MENSAGEM COM NÚMERO DE RESULTADOS
        const resultText = totalResults === 1 ? '1 resultado encontrado' : `${totalResults} resultados encontrados`;
        showNotification(`Busca: "${searchTerm}" - ${resultText}`, 'success', 3000);
    } else {
        showNotification(`Busca: "${searchTerm}" - Nenhum resultado encontrado`, 'warning', 3000);
    }
}
/**
 * 🎯 DESTACAR TEXTO ENCONTRADO
 */
function highlightText(element, searchTerm) {
    const text = element.textContent;
    const regex = new RegExp(`(${searchTerm})`, 'gi');
    const highlighted = text.replace(regex, '<mark class="bg-yellow-300 px-1 rounded">$1</mark>');
    element.innerHTML = highlighted;
}

		/**
 * ✅ FILTRAR APENAS DIVERGÊNCIAS
 * Mostra apenas linhas onde:
 * - Coluna "Diferença" (5ª coluna) ≠ 0
 * - OU Coluna "OBS" (6ª coluna) tem conteúdo
 */
function filtrarDivergencias() {
    const table = document.getElementById('conferencia-table');
    if (!table) {
        showNotification('Tabela de conferência não encontrada', 'error');
        return;
    }

    const rows = table.querySelectorAll('tbody tr');
    const button = document.getElementById('divergencias-button');
    const isFilterActive = button.textContent.includes('Mostrar todas');
    
    let divergenciasCount = 0;
    let totalRows = 0;

    rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length >= 7) {
            totalRows++;
            
            const diferencaCell = cells[4]; // 5ª coluna (Diferença)
            const danosDefeitoCell = cells[6]; // 7ª coluna (Danos/Defeito e Obs)
            
            let isDivergencia = false;
            
            // Verifica se é divergência (diferente de 0)
            if (diferencaCell) {
                const diferencaText = diferencaCell.textContent.trim();
                const diferencaValue = parseFloat(diferencaText.replace(',', '.'));
                if (!isNaN(diferencaValue) && diferencaValue !== 0) {
                    isDivergencia = true;
                }
            }
            
            // ✅ CORREÇÃO: VERIFICA APENAS O TEXTO REAL (não o botão)
            if (danosDefeitoCell) {
                const elementoEditavel = danosDefeitoCell.querySelector('[contenteditable="true"]');
                const textoReal = elementoEditavel ? elementoEditavel.textContent.trim() : '';
                
                if (textoReal !== '') {
                    isDivergencia = true;
                }
            }
            
            if (isFilterActive) {
                // Modo "Mostrar todas" - mostra todas as linhas
                row.style.display = '';
                if (isDivergencia) {
                    row.classList.add('bg-yellow-50');
                    divergenciasCount++;
                } else {
                    row.classList.remove('bg-yellow-50');
                }
            } else {
                // Modo "Mostrar apenas divergências" - filtra
                if (isDivergencia) {
                    row.style.display = '';
                    row.classList.add('bg-yellow-50');
                    divergenciasCount++;
                } else {
                    row.style.display = 'none';
                    row.classList.remove('bg-yellow-50');
                }
            }
        }
    });
    
    // Alterna o texto do botão
    if (isFilterActive) {
        button.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
            <span>Mostrar apenas divergências</span>
        `;
        button.classList.remove('bg-green-100', 'text-green-700', 'border-green-300', 'hover:bg-green-200');
        button.classList.add('bg-red-100', 'text-red-700', 'border-red-300', 'hover:bg-red-200');
        showNotification(`Mostrando todas as ${totalRows} linhas`, 'info', 3000);
    } else {
        button.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>Mostrar todas as linhas</span>
        `;
        button.classList.remove('bg-red-100', 'text-red-700', 'border-red-300', 'hover:bg-red-200');
        button.classList.add('bg-green-100', 'text-green-700', 'border-green-300', 'hover:bg-green-200');
        showNotification(`Filtro aplicado: ${divergenciasCount} divergências de ${totalRows} linhas totais`, 'success', 4000);
    }
}

function loadConferenceAdjustments() {
    try {
        const cached = localStorage.getItem(CONFERENCE_ADJUSTMENTS_KEY);
        if (!cached) return {};
        
        const cacheData = JSON.parse(cached);
        
        // ✅ MUDAR PARA 1 HORA (ou menos) EM VEZ DE 24 HORAS
        if (Date.now() - cacheData.timestamp > (1 * 60 * 60 * 1000)) {
            localStorage.removeItem(CONFERENCE_ADJUSTMENTS_KEY);
            return {};
        }
        
        return cacheData.data || {};
    } catch (error) {
        console.error('Erro ao carregar cache de ajustes:', error);
        return {};
    }
}

/**
 * ✅ EXTRAIR NOME DA LOJA DA URL
 */
function extrairNomeDaLoja() {
    const hostname = window.location.hostname;
    
    // Remove o .gtgo.com.br e pega a parte antes
    const partes = hostname.split('.');
    if (partes.length > 0) {
        let nomeLoja = partes[0];
        
        // Adiciona hífen entre letras e números
        nomeLoja = nomeLoja.replace(/([a-zA-Z])(\d)/, '$1-$2');
        
        // Remove tudo depois dos números
        nomeLoja = nomeLoja.replace(/(-\d+).*$/, '$1');
        
        return nomeLoja;
    }
    
    return 'Loja';
}

/**
 * ✅ EXTRAIR NÚMEROS DAS NOTAS FISCAIS
 */
function extrairNumerosNotasFiscais() {
    const notas = [];
    
    // Procura pelas informações das notas fiscais acima da tabela
    const elementosNotas = document.querySelectorAll('#dynamic-table-content-conferencia .mb-4 > div');
    
    elementosNotas.forEach(elemento => {
        const texto = elemento.textContent;
        
        // Procura por "Nfe:" seguido de números
        const matchNfe = texto.match(/Nfe:\s*(\d+)/i);
        if (matchNfe) {
            notas.push(matchNfe[1]);
        }
        
        // Também procura por "NF:" (formato antigo)
        const matchNF = texto.match(/NF:\s*(\d+)/i);
        if (matchNF && !notas.includes(matchNF[1])) {
            notas.push(matchNF[1]);
        }
    });
    
    return notas;
}

/**
 * ✅ FORMATAR LISTA DE NOTAS FISCAIS
 */
function formatarNotasFiscais(notas) {
    if (notas.length === 0) return 'NFe(s) não identificada(s)';
    if (notas.length === 1) return `Nfe: ${notas[0]}`;
    
    return `Nfe: ${notas.join(', ')}`;
}

function converterParaNovoFormato(opcoesAntigas) {
    if (!opcoesAntigas || opcoesAntigas.length === 0) return [];
    
    // Se já é array de objetos, retorna como está
    if (typeof opcoesAntigas[0] === 'object') {
        return opcoesAntigas;
    }
    
    // Se é array de strings, converte para objetos
    return opcoesAntigas.map(frase => ({
        texto: frase,
        quantidade: 1
    }));
}

async function salvarOpcoesDanosDefeito(opcoes) {
    if (!Array.isArray(opcoes)) {
        console.error('❌ Tentativa de salvar opções inválidas:', opcoes);
        return false;
    }
    
    // ✅ CONVERTE para formato que o backend espera (apenas textos)
    const opcoesParaBackend = opcoes.map(opcao => {
        return opcao.texto || opcao; // Pega apenas o texto
    });
    
    console.log('💾 Salvando opções (convertidas):', opcoesParaBackend);
    
    try {
        const response = await fetch(`${BACKEND_URL}/api/opcoes-danos-defeito`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ opcoes: opcoesParaBackend }) // ✅ Envia array de strings
        });
        
        const result = await response.json();
        
        if (result.success) {
            console.log('✅ Opções salvas com sucesso!');
            showNotification('Frases salvas!', 'success', 2000);
            return true;
        } else {
            throw new Error(result.error || 'Erro desconhecido');
        }
        
    } catch (error) {
        console.error('❌ Erro ao salvar:', error);
        showNotification('Erro ao salvar frases: ' + error.message, 'error', 3000);
        return false;
    }
}

// ✅ ATUALIZE a função adicionarNovoDefeitoLista
async function adicionarNovoDefeitoLista(sheetRange) {
    const menu = document.querySelector('.menu-danos-defeito');
    const input = menu.querySelector('#input-dano-customizado');
    const textoCustomizado = input.value.trim();
    
    if (!textoCustomizado) {
        showNotification('Digite um texto para adicionar', 'warning');
        return;
    }
    
    opcoesDanosDefeito = await carregarOpcoesDanosDefeito();
    
    // Verifica se já existe (agora por texto)
    const jaExiste = opcoesDanosDefeito.some(opcao => 
        (opcao.texto || opcao) === textoCustomizado
    );
    
    if (!jaExiste) {
        // ✅ ADICIONA COMO OBJETO COM QUANTIDADE
        opcoesDanosDefeito.push({
            texto: textoCustomizado,
            quantidade: 1
        });
        
        const salvou = await salvarOpcoesDanosDefeito(opcoesDanosDefeito);
        
        if (salvou) {
            // Adiciona diretamente à célula também
            const celula = document.querySelector(`td [data-sheet-range="${sheetRange}"]`);
            if (celula) {
                const textoAtual = celula.textContent.trim();
                const novoTexto = textoAtual ? `${textoAtual}, ${textoCustomizado}` : textoCustomizado;
                
                celula.textContent = novoTexto;
                const event = new Event('blur');
                celula.dispatchEvent(event);
            }
            
            input.value = '';
            fecharMenuDanos();
            
            setTimeout(() => {
                const botao = document.querySelector('.opcao-danos-btn');
                if (botao) mostrarOpcoesDanos(botao, sheetRange);
            }, 100);
        }
    } else {
        showNotification('Esta frase já existe na lista', 'info');
    }
}

		/**
 * ✅ NOVA FUNÇÃO: APLICA FORMATAÇÃO CONDICIONAL NA ABA CONFERENCIA
 * - Diferença negativa: Vermelho apenas na coluna Diferença
 * - Diferença positiva: Verde apenas na coluna Diferença  
 * - Danos/Defeito preenchido: Vermelho suave apenas na coluna Danos/Defeito (texto preto)
 */
function aplicarConferenciaStyles(numCols) {
    const table = document.getElementById('conferencia-table');
    if (!table) return;

    const rows = table.querySelectorAll('tbody tr');

    rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length < 7) return;

        const diferencaCell = cells[4]; // 5ª coluna (Diferença)
        const danosDefeitoCell = cells[6]; // 7ª coluna (Danos/Defeito e Obs)
        
        // ✅ 1. LIMPAR TODAS AS CLASSES DE COR ANTERIORES
        if (diferencaCell) {
            diferencaCell.classList.remove('bg-fee2e2', 'text-b91c1c', 'bg-green-100', 'text-green-700');
        }
        
        // ✅ 2. VERIFICAR DIFERENÇA 
        if (diferencaCell) {
            const diferencaText = diferencaCell.textContent.trim();
            const diferencaValue = parseFloat(diferencaText.replace(',', '.'));
            
            if (!isNaN(diferencaValue)) {
                if (diferencaValue < 0) {
                    // ✅ DIFERENÇA NEGATIVA: VERMELHO APENAS NA COLUNA DIFERENÇA
                    diferencaCell.classList.add('bg-fee2e2', 'text-b91c1c');
                } else if (diferencaValue > 0) {
                    // ✅ DIFERENÇA POSITIVA: VERDE APENAS NA COLUNA DIFERENÇA
                    diferencaCell.classList.add('bg-green-100', 'text-green-700');
                }
            }
        }

        // ✅ 3. VERIFICAR DANOS/DEFEITO PREENCHIDO - VERMELHO SUAVE COM TEXTO PRETO
        if (danosDefeitoCell) {
            // ✅ CORREÇÃO: VERIFICA APENAS O TEXTO REAL (não o botão +)
            const elementoEditavel = danosDefeitoCell.querySelector('[contenteditable="true"]');
            const textoReal = elementoEditavel ? elementoEditavel.textContent.trim() : '';
            
            // Remove classes anteriores
            danosDefeitoCell.classList.remove('bg-red-100', 'bg-fee2e2', 'text-b91c1c');
            
            if (textoReal !== '') {
                // ✅ SÓ APLICA VERMELHO SE HOUVER TEXTO REAL DIGITADO
                danosDefeitoCell.classList.add('bg-red-100');
                
                // ✅ GARANTIR QUE O TEXTO FIQUE PRETO (não vermelho)
                if (elementoEditavel) {
                    elementoEditavel.style.color = '#374151'; // Cor cinza escuro (texto normal)
                }
            } else {
                // ✅ SE ESTIVER VAZIA, GARANTIR COR NORMAL
                if (elementoEditavel) {
                    elementoEditavel.style.color = ''; // Volta para cor padrão
                }
            }
        }
    });
}



	// ✅ FUNÇÃO PARA REMOVER OPÇÃO (CORRIGIDA)
async function removerOpcaoDano(textoOpcao, event) {
    event.stopPropagation();
    
    if (confirm(`Deseja remover "${textoOpcao}" da lista?`)) {
        try {
            // ✅ CORREÇÃO: Remove por texto, não por objeto completo
            opcoesDanosDefeito = opcoesDanosDefeito.filter(item => {
                const textoItem = item.texto || item;
                return textoItem !== textoOpcao;
            });
            
            // Salva no Google Sheets
            const salvou = await salvarOpcoesDanosDefeito(opcoesDanosDefeito);
            
            if (salvou) {
                showNotification(`"${textoOpcao}" removido da lista`, 'success', 2000);
                
                // Fecha e reabre o menu para atualizar
                fecharMenuDanos();
                setTimeout(() => {
                    const botao = document.querySelector('.opcao-danos-btn');
                    if (botao) {
                        const celula = botao.closest('td');
                        const elementoEditavel = celula.querySelector('[contenteditable="true"]');
                        const sheetRange = elementoEditavel.getAttribute('data-sheet-range');
                        mostrarOpcoesDanos(botao, sheetRange);
                    }
                }, 100);
            }
        } catch (error) {
            console.error('Erro ao remover opção:', error);
            showNotification('Erro ao remover opção', 'error');
        }
    }
}
